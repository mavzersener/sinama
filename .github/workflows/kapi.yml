# Sınama CI kapısı (ADR-001, A2.4)
#
# Yerel kancalar (.githooks) yalnız kurulu oldukları klonda çalışır; Codex
# bulutu ya da GitHub web arayüzünden gelen commit'ler onları hiç görmez.
# Bu iş akışı bu yüzden bekçiyi TÜM GEÇMİŞ üzerinde yeniden koşar (üçüncü
# savunma hattı) ve çekirdeğin tam kapısını Windows ve Linux'ta çalıştırır
# (cp1252/CRLF gibi Windows tuzakları yalnız Windows'ta görünür).
#
# Tekrar üretilebilirlik: eylemler etiketle değil COMMIT SHA'sıyla sabit
# (etiket taşınabilir, SHA taşınamaz); çalıştırıcı imajları da sabit —
# `-latest` etiketleri sessizce yeni işletim sistemine geçer. Yükseltme
# yalnız bilinçli bir commit'le yapılır.
name: kapi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kapi-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  bekci:
    name: veri bekçisi (tüm geçmiş)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Bekçi testleri
        run: python -m unittest discover -s tests -v
      - name: Bekçi — tüm commit'ler
        run: python betikler/veri_bekcisi.py --gecmis

  kiyas:
    # BMK kapı DEĞİLDİR (başarısız ölçüt bir bulgudur); burada yalnız ön-kayıt
    # kilidinin sağlamlığı ve yeniden ölçümün kayıtlı sonuçla BİREBİR aynı olduğu
    # denetlenir. Kayıtlı sonuç Windows/py3.14'te üretildi; burada Linux/py3.12
    # — platformlar arası tekrar üretilebilirlik.
    name: BMK — kilit ve tekrar üretilebilirlik
    needs: bekci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Kilit + yeniden ölçüm = kayıtlı sonuç (v0)
        run: python kiyas/kos.py --dogrula
      - name: Kilit + yeniden ölçüm = kayıtlı sonuç (v1)
        run: python kiyas/v1/kos_v1.py --dogrula
      - name: Kilit + yeniden ölçüm = kayıtlı sonuç (v2)
        run: python kiyas/v2/kos_v2.py --dogrula
      - name: Kilit + yeniden ölçüm = kayıtlı sonuç (v3)
        run: python kiyas/v3/kos_v3.py --dogrula
      - name: Kilit + yeniden ölçüm = kayıtlı sonuç (v4)
        run: python kiyas/v4/kos_v4.py --dogrula

  cekirdek:
    name: çekirdek tam kapı (${{ matrix.os }}, py${{ matrix.python }})
    needs: bekci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-2025
            python: "3.14"
    defaults:
      run:
        shell: bash
        working-directory: cekirdek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Birim + kapsam + MCP + demolar (test.sh)
        run: sh test.sh
