# Sınama CI kapısı (ADR-001, A2.4)
#
# Yerel kancalar (.githooks) yalnız kurulu oldukları klonda çalışır; Codex
# bulutu ya da GitHub web arayüzünden gelen commit'ler onları hiç görmez.
# Bu iş akışı bu yüzden bekçiyi TÜM GEÇMİŞ üzerinde yeniden koşar (üçüncü
# savunma hattı) ve çekirdeğin tam kapısını Windows ve Linux'ta çalıştırır
# (cp1252/CRLF gibi Windows tuzakları yalnız Windows'ta görünür).
#
# Tekrar üretilebilirlik: eylemler etiketle değil COMMIT SHA'sıyla sabit
# (etiket taşınabilir, SHA taşınamaz); çalıştırıcı imajları da sabit —
# `-latest` etiketleri sessizce yeni işletim sistemine geçer. Yükseltme
# yalnız bilinçli bir commit'le yapılır.
name: kapi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kapi-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  bekci:
    name: veri bekçisi (tüm geçmiş)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Bekçi testleri
        run: python -m unittest discover -s tests -v
      - name: Bekçi — tüm commit'ler
        run: python betikler/veri_bekcisi.py --gecmis

  kiyas:
    # BMK kapı DEĞİLDİR (başarısız ölçüt bir bulgudur); burada yalnız ön-kayıt
    # kilidinin sağlamlığı ve yeniden ölçümün kayıtlı sonuçla BİREBİR aynı olduğu
    # denetlenir. Kayıtlı sonuç Windows/py3.14'te üretildi; burada Linux/py3.12
    # — platformlar arası tekrar üretilebilirlik. Sürüm başına ayrı iş (paralel):
    # v3–v5 Rehberli akışı yüzlerce kez koşar; tek iş 15 dakikayı aşıyordu (v5).
    name: BMK ${{ matrix.surum }} — kilit ve tekrar üretilebilirlik
    needs: bekci
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - surum: v0
            kosucu: kiyas/kos.py
          - surum: v1
            kosucu: kiyas/v1/kos_v1.py
          - surum: v2
            kosucu: kiyas/v2/kos_v2.py
          - surum: v3
            kosucu: kiyas/v3/kos_v3.py
          - surum: v4
            kosucu: kiyas/v4/kos_v4.py
          - surum: v5
            kosucu: kiyas/v5/kos_v5.py
          - surum: v6
            kosucu: kiyas/v6/kos_v6.py
          - surum: v7
            kosucu: kiyas/v7/kos_v7.py
          - surum: v8
            kosucu: kiyas/v8/kos_v8.py
          - surum: v9
            kosucu: kiyas/v9/kos_v9.py
          - surum: v10
            kosucu: kiyas/v10/kos_v10.py
            paketler: -r uygulama/gereksinimler.txt   # A5 arka ucu (çekirdek stdlib kalır)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Sürüme özgü paketler
        if: matrix.paketler
        run: python -m pip install ${{ matrix.paketler }}
      - name: Kilit + yeniden ölçüm = kayıtlı sonuç
        run: python ${{ matrix.kosucu }} --dogrula

  uygulama:
    # A5 arka ucu (ADR-003): FastAPI yalnız uygulama/ için kurulur; çekirdek işleri
    # paketsiz koşar ve standart kitaplıkla çalıştığını böylece kanıtlar.
    name: uygulama (A5 arka uç)
    needs: bekci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Paketler
        run: python -m pip install -r uygulama/gereksinimler.txt
      - name: Arka uç testleri
        run: python -m unittest tests.test_uygulama -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
      - name: Ön yüz — tür denetimi ve derleme
        working-directory: uygulama/web
        run: npm ci --no-audit --no-fund && npm run build

  cekirdek:
    name: çekirdek tam kapı (${{ matrix.os }}, py${{ matrix.python }})
    needs: bekci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-2025
            python: "3.14"
    defaults:
      run:
        shell: bash
        working-directory: cekirdek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Birim + kapsam + MCP + demolar (test.sh)
        run: sh test.sh
